name: Publish Vuln Report Kit 1.1.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-1.1.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="1.1.0"
          TITLE="Vuln Report Kit 1.1.0 — Light / Advanced Mode"

          test -f main.js
          test -f manifest.json
          test -f styles.css
          test -f RELEASE-NOTES-v1.1.0.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG"               --title "$TITLE"               --notes-file RELEASE-NOTES-v1.1.0.md               --latest
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG"               main.js manifest.json styles.css               --target main               --title "$TITLE"               --notes-file RELEASE-NOTES-v1.1.0.md               --latest
          fi
